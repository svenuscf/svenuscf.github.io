<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">IPv4 tenant packet over an IPv6 link-local EVPN-VXLAN underlay</title>
  <desc id="desc">An IPv4 packet enters Leaf 1, is routed in the tenant VRF, VXLAN encapsulated, transported through either spine using IPv6 link-local underlay adjacencies, and delivered by Leaf 2.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081525"/><stop offset="1" stop-color="#17324a"/></linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity=".4"/></filter>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="1200" height="690" rx="28" fill="url(#bg3)"/>
  <text x="60" y="66" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">One packet, two layers of addressing</text>
  <text x="60" y="102" fill="#adc9df" font-family="Inter,Arial,sans-serif" font-size="18">The tenant remains IPv4; IPv6 link-local identifies the directly connected underlay adjacency.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#s3)">
    <rect x="55" y="288" width="160" height="105" rx="18" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="135" y="327" text-anchor="middle" fill="#fef3c7" font-size="15" font-weight="700">HOST A</text>
    <text x="135" y="360" text-anchor="middle" fill="#fff7ed" font-size="19">IPv4 source</text>

    <rect x="300" y="245" width="220" height="190" rx="20" fill="#14532d" stroke="#34d399" stroke-width="2"/>
    <text x="410" y="287" text-anchor="middle" fill="#bbf7d0" font-size="15" font-weight="700">LEAF 1 · INGRESS VTEP</text>
    <text x="410" y="325" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Route in tenant VRF</text>
    <text x="410" y="359" text-anchor="middle" fill="#d1fae5" font-size="15">Select remote VTEP</text>
    <text x="410" y="384" text-anchor="middle" fill="#d1fae5" font-size="15">Add VXLAN header</text>
    <text x="410" y="409" text-anchor="middle" fill="#6ee7b7" font-size="14">L3 VNI</text>

    <rect x="670" y="145" width="185" height="105" rx="18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
    <text x="762" y="186" text-anchor="middle" fill="#bfdbfe" font-size="15" font-weight="700">SPINE 1</text>
    <text x="762" y="218" text-anchor="middle" fill="#f8fafc" font-size="17">ECMP path A</text>
    <rect x="670" y="430" width="185" height="105" rx="18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
    <text x="762" y="471" text-anchor="middle" fill="#bfdbfe" font-size="15" font-weight="700">SPINE 2</text>
    <text x="762" y="503" text-anchor="middle" fill="#f8fafc" font-size="17">ECMP path B</text>

    <rect x="935" y="245" width="210" height="190" rx="20" fill="#14532d" stroke="#34d399" stroke-width="2"/>
    <text x="1040" y="287" text-anchor="middle" fill="#bbf7d0" font-size="15" font-weight="700">LEAF 2 · EGRESS VTEP</text>
    <text x="1040" y="325" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Remove VXLAN</text>
    <text x="1040" y="359" text-anchor="middle" fill="#d1fae5" font-size="15">Destination lookup</text>
    <text x="1040" y="384" text-anchor="middle" fill="#d1fae5" font-size="15">Forward original IPv4</text>
    <text x="1040" y="409" text-anchor="middle" fill="#6ee7b7" font-size="14">Tenant VRF</text>
  </g>

  <g fill="none" stroke-width="5" marker-end="url(#a3)">
    <line x1="215" y1="340" x2="290" y2="340" stroke="#38bdf8"/>
    <path d="M520 310C575 310 595 198 660 198" stroke="#38bdf8"/>
    <path d="M520 375C575 375 595 482 660 482" stroke="#38bdf8"/>
    <path d="M855 198C910 198 880 310 925 310" stroke="#38bdf8"/>
    <path d="M855 482C910 482 880 375 925 375" stroke="#38bdf8"/>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="310" y="530" width="585" height="100" rx="22" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <text x="602" y="566" text-anchor="middle" fill="#ddd6fe" font-size="16" font-weight="700">UNDERLAY RESOLUTION</text>
    <text x="602" y="596" text-anchor="middle" fill="#f5f3ff" font-size="19">IPv4 VTEP route → IPv6 link-local next hop + outgoing interface</text>
    <path d="M410 445V520" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a4)"/>
    <rect x="480" y="122" width="245" height="58" rx="20" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="602" y="147" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="700">OUTER TRANSPORT</text>
    <text x="602" y="168" text-anchor="middle" fill="#f0f9ff" font-size="14">VXLAN between IPv4 VTEPs</text>
  </g>
</svg>
