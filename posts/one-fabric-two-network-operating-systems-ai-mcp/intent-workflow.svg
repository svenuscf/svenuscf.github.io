<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Intent-driven AI and MCP network workflow</title>
  <desc id="desc">The architect supplies intent and guardrails. An AI agent uses MCP tools to discover, configure, and validate SONiC and Cumulus devices, then returns evidence.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a2f"/><stop offset="1" stop-color="#132f46"/></linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity=".4"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg2)"/>
  <text x="60" y="66" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">From intent to evidence</text>
  <text x="60" y="102" fill="#adc9df" font-family="Inter,Arial,sans-serif" font-size="18">The agent translates and verifies; the architect owns the design and boundaries.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#s2)">
    <rect x="65" y="205" width="215" height="150" rx="20" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
    <text x="172" y="247" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">ARCHITECT</text>
    <text x="172" y="283" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">Design intent</text>
    <text x="172" y="315" text-anchor="middle" fill="#cbd5e1" font-size="15">Scope · constraints</text>
    <text x="172" y="338" text-anchor="middle" fill="#cbd5e1" font-size="15">acceptance criteria</text>

    <rect x="360" y="175" width="225" height="210" rx="20" fill="#283b68" stroke="#a78bfa" stroke-width="2"/>
    <text x="472" y="220" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700">CODEX / CURSOR</text>
    <text x="472" y="258" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">AI agent</text>
    <text x="472" y="294" text-anchor="middle" fill="#ddd6fe" font-size="15">Reason over state</text>
    <text x="472" y="319" text-anchor="middle" fill="#ddd6fe" font-size="15">Translate intent</text>
    <text x="472" y="344" text-anchor="middle" fill="#ddd6fe" font-size="15">Compare outcomes</text>

    <rect x="665" y="175" width="210" height="210" rx="20" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <text x="770" y="220" text-anchor="middle" fill="#67e8f9" font-size="15" font-weight="700">CONTROL BOUNDARY</text>
    <text x="770" y="258" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">MCP tools</text>
    <text x="770" y="294" text-anchor="middle" fill="#cffafe" font-size="15">Discover</text>
    <text x="770" y="319" text-anchor="middle" fill="#cffafe" font-size="15">Configure</text>
    <text x="770" y="344" text-anchor="middle" fill="#cffafe" font-size="15">Validate · back up</text>

    <rect x="960" y="155" width="175" height="105" rx="18" fill="#16406b" stroke="#3b82f6" stroke-width="2"/>
    <text x="1047" y="197" text-anchor="middle" fill="#bfdbfe" font-size="15" font-weight="700">SONiC</text>
    <text x="1047" y="228" text-anchor="middle" fill="#f8fafc" font-size="18">sonic-cli</text>
    <rect x="960" y="300" width="175" height="105" rx="18" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="1047" y="342" text-anchor="middle" fill="#bbf7d0" font-size="15" font-weight="700">CUMULUS</text>
    <text x="1047" y="373" text-anchor="middle" fill="#f8fafc" font-size="18">NVUE + FRR</text>
  </g>

  <g fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)">
    <path d="M280 280H350"/>
    <path d="M585 280H655"/>
    <path d="M875 250C910 250 915 207 950 207"/>
    <path d="M875 310C910 310 915 352 950 352"/>
  </g>

  <path d="M1045 430C1045 545 780 565 500 565C280 565 170 500 170 375" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow2)"/>
  <rect x="477" y="523" width="300" height="62" rx="20" fill="#713f12" stroke="#fbbf24" stroke-width="2"/>
  <text x="627" y="548" text-anchor="middle" fill="#fde68a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">EVIDENCE LOOP</text>
  <text x="627" y="570" text-anchor="middle" fill="#fef3c7" font-family="Inter,Arial,sans-serif" font-size="14">Observed state returns to the design</text>
</svg>
