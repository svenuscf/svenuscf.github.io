<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Human-led evidence loop for AI-assisted architecture work</title>
  <desc id="desc">A workflow where a human sets intent and guardrails, AI helps structure and investigate, evidence is checked, and the human remains accountable for decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f9ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#0e7490"/></marker>
    <style>.label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.small{font:500 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569}.title{font:700 29px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0f172a}.node{stroke-width:2}.arrow{fill:none;stroke:#0e7490;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>
  <text x="600" y="70" text-anchor="middle" class="title">AI-assisted work is an evidence loop, not an automated decision</text>
  <rect x="70" y="180" width="250" height="190" rx="22" fill="#ffffff" stroke="#0e7490" class="node"/>
  <text x="195" y="235" text-anchor="middle" class="title">Human intent</text>
  <text x="195" y="275" text-anchor="middle" class="small">scope · constraints</text>
  <text x="195" y="305" text-anchor="middle" class="small">acceptance criteria</text>
  <text x="195" y="335" text-anchor="middle" class="small">guardrails</text>
  <rect x="470" y="180" width="260" height="190" rx="22" fill="#cffafe" stroke="#0891b2" class="node"/>
  <text x="600" y="235" text-anchor="middle" class="title">AI assistance</text>
  <text x="600" y="275" text-anchor="middle" class="small">structure · compare</text>
  <text x="600" y="305" text-anchor="middle" class="small">hypothesise · draft</text>
  <text x="600" y="335" text-anchor="middle" class="small">surface questions</text>
  <rect x="880" y="180" width="250" height="190" rx="22" fill="#ffffff" stroke="#0e7490" class="node"/>
  <text x="1005" y="235" text-anchor="middle" class="title">Evidence</text>
  <text x="1005" y="275" text-anchor="middle" class="small">tests · observations</text>
  <text x="1005" y="305" text-anchor="middle" class="small">assumptions checked</text>
  <text x="1005" y="335" text-anchor="middle" class="small">limits stated</text>
  <path d="M320 275H455" class="arrow"/>
  <path d="M730 275H865" class="arrow"/>
  <path d="M1005 370C1005 540 195 540 195 385" class="arrow"/>
  <rect x="320" y="510" width="560" height="95" rx="20" fill="#0f172a"/>
  <text x="600" y="552" text-anchor="middle" style="font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff">Human accountability: approve, challenge, accept risk, decide</text>
  <text x="600" y="583" text-anchor="middle" style="font:500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#bae6fd">The decision is informed by AI, never outsourced to it.</text>
</svg>
