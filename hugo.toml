baseURL = "https://garywong.pro/"
languageCode = "en-us"
title = "Gary Wong's Blog"
theme = "PaperMod"

pagination.pagerSize = 10

enableRobotsTXT = true

[params]
  env = "production"
  customCSS = ["css/extended/home.css"]
  defaultTheme = "auto"        # auto / dark / light
  ShowReadingTime = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true

 [params.homeInfoParams]
 title = "Architecture, networks, and the work of making AI useful"
 content = "Notes from a technical architect exploring how sound design, evidence, and agentic workflows can make complex technology more dependable."

