<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">One EVPN-VXLAN fabric implemented on SONiC and Cumulus</title>
  <desc id="desc">Two spines connect redundantly to two leaves. The same logical topology was implemented first on SONiC Enterprise and then on Cumulus Linux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4b73"/>
      <stop offset="1" stop-color="#173957"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">One logical fabric, implemented twice</text>
  <text x="60" y="102" fill="#a8c4df" font-family="Inter,Arial,sans-serif" font-size="18">The acceptance criteria stay constant while each NOS uses its native configuration model.</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="818" y="42" width="142" height="44" rx="22" fill="#2563eb"/>
    <text x="889" y="70" text-anchor="middle" fill="white" font-size="16" font-weight="700">RUN 1 · SONiC</text>
    <rect x="974" y="42" width="166" height="44" rx="22" fill="#16a34a"/>
    <text x="1057" y="70" text-anchor="middle" fill="white" font-size="16" font-weight="700">RUN 2 · CUMULUS</text>
  </g>

  <g stroke="#5eead4" stroke-width="5" opacity=".8" marker-start="url(#dot)" marker-end="url(#dot)">
    <line x1="370" y1="245" x2="350" y2="425"/>
    <line x1="370" y1="245" x2="850" y2="425"/>
    <line x1="830" y1="245" x2="350" y2="425"/>
    <line x1="830" y1="245" x2="850" y2="425"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g>
      <rect x="250" y="155" width="240" height="110" rx="20" fill="url(#node)" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="295" cy="200" r="20" fill="#60a5fa"/>
      <path d="M285 200h20M295 190v20M287 192l16 16M303 192l-16 16" stroke="#082f49" stroke-width="3"/>
      <text x="330" y="198" fill="#f8fafc" font-size="24" font-weight="700">Spine 1</text>
      <text x="330" y="226" fill="#b9d4ec" font-size="16">eBGP + EVPN</text>
    </g>
    <g>
      <rect x="710" y="155" width="240" height="110" rx="20" fill="url(#node)" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="755" cy="200" r="20" fill="#60a5fa"/>
      <path d="M745 200h20M755 190v20M747 192l16 16M763 192l-16 16" stroke="#082f49" stroke-width="3"/>
      <text x="790" y="198" fill="#f8fafc" font-size="24" font-weight="700">Spine 2</text>
      <text x="790" y="226" fill="#b9d4ec" font-size="16">eBGP + EVPN</text>
    </g>
    <g>
      <rect x="230" y="405" width="240" height="120" rx="20" fill="url(#node)" stroke="#34d399" stroke-width="2"/>
      <circle cx="275" cy="452" r="20" fill="#34d399"/>
      <path d="M265 452h20M275 442v20M267 444l16 16M283 444l-16 16" stroke="#064e3b" stroke-width="3"/>
      <text x="310" y="447" fill="#f8fafc" font-size="24" font-weight="700">Leaf 1</text>
      <text x="310" y="475" fill="#b9d4ec" font-size="16">VTEP + Anycast GW</text>
      <text x="310" y="500" fill="#7dd3fc" font-size="14">BLUE · GREEN</text>
    </g>
    <g>
      <rect x="730" y="405" width="240" height="120" rx="20" fill="url(#node)" stroke="#34d399" stroke-width="2"/>
      <circle cx="775" cy="452" r="20" fill="#34d399"/>
      <path d="M765 452h20M775 442v20M767 444l16 16M783 444l-16 16" stroke="#064e3b" stroke-width="3"/>
      <text x="810" y="447" fill="#f8fafc" font-size="24" font-weight="700">Leaf 2</text>
      <text x="810" y="475" fill="#b9d4ec" font-size="16">VTEP + Anycast GW</text>
      <text x="810" y="500" fill="#7dd3fc" font-size="14">BLUE · GREEN</text>
    </g>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <line x1="350" y1="525" x2="350" y2="578" stroke="#94a3b8" stroke-width="3"/>
    <line x1="850" y1="525" x2="850" y2="578" stroke="#94a3b8" stroke-width="3"/>
    <rect x="260" y="578" width="180" height="54" rx="14" fill="#f59e0b"/>
    <rect x="760" y="578" width="180" height="54" rx="14" fill="#f59e0b"/>
    <text x="350" y="611" text-anchor="middle" fill="#422006" font-size="18" font-weight="700">Single-homed host</text>
    <text x="850" y="611" text-anchor="middle" fill="#422006" font-size="18" font-weight="700">Single-homed host</text>
    <rect x="482" y="320" width="236" height="58" rx="29" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
    <text x="600" y="346" text-anchor="middle" fill="#ecfeff" font-size="16" font-weight="700">IPv4 over IPv6 link-local</text>
    <text x="600" y="366" text-anchor="middle" fill="#ccfbf1" font-size="13">dual-path routed underlay</text>
  </g>
</svg>
